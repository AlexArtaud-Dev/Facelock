[package]
name = "facelock"
version = "2.0.0"
edition = "2021"
description = "Verrouillage automatique par reconnaissance faciale - Windows"
license = "MIT"

[dependencies]
tract-onnx = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
winvd = "0.0.49"
windows58 = { package = "windows", version = "0.58", features = ["Win32_Foundation"] }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }
